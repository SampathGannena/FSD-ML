services:
  - type: web
    name: fsd-ml-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: cd Backend && npm ci --omit=dev --no-audit --prefer-offline && pip install --no-cache-dir -r ml/requirements-render.txt
    startCommand: cd Backend && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MONGO_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
    autoDeploy: true
